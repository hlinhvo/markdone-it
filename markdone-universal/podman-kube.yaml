apiVersion: v1
kind: Pod
metadata:
  name: markdone-universal
spec:
  restartPolicy: Always
  containers:
    - name: markdone-api
      image: localhost/markdone-universal:latest
      ports:
        - containerPort: 7482
          hostPort: 7482
      env:
        - name: PORT
          value: "7482"
        - name: MARKDONE_BIND_HOST
          value: "0.0.0.0"
        - name: UPLOAD_DIR
          value: "/app/uploads"
        - name: OUTPUT_DIR
          value: "/app/outputs"
        - name: VAULT_OUTPUT_DIR
          value: "/app/outputs/vault"
        - name: MAX_CONCURRENT_CONVERSIONS
          value: "4"
        - name: MAX_FILE_SIZE_MB
          value: "100"
        - name: MAX_FILES_PER_REQUEST
          value: "20"
        - name: UPLOAD_RETENTION_MINUTES
          value: "10"
        - name: LOG_LEVEL
          value: "info"
      resources:
        requests:
          cpu: "50m"
          memory: "128Mi"
        limits:
          cpu: "4"
          memory: "2Gi"
      volumeMounts:
        - name: markdone-vault
          mountPath: /app/outputs/vault
  volumes:
    - name: markdone-vault
      hostPath:
        path: /Users/linhvh/IBM-Bob/MarkDone-v2/markdone-universal/outputs/vault
        type: Directory

