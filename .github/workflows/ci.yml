name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r markdone-universal/requirements-dev.txt
    
    - name: Run pytest
      run: |
        cd markdone-universal
        python -m pytest tests/ -v --tb=short
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-results
        path: markdone-universal/pytest-report.xml
        if-no-files-found: ignore

  test-deno:
    name: Deno Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v2.x
    
    - name: Run Deno tests
      run: |
        cd markdone-universal
        deno test --allow-net --allow-read --allow-write --allow-env tests/integration.ts

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff mypy
    
    - name: Run ruff
      run: |
        cd markdone-universal
        ruff check services/ tests/ || true
    
    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v2.x
    
    - name: Run Deno lint
      run: |
        cd markdone-universal
        deno lint server.ts || true

# Made with Bob
